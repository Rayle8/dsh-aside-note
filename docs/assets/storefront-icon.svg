    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C661"/>
      <stop offset="1" stop-color="#E29A2C"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#tile)"/>
