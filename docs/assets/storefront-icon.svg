<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 180 180">
  <!--
    商店图标母版：插件市场只收位图，所以这里按 540px 渲染（3× 于 180）后缩到
    180×180，输出到仓库根目录的 icon.png。卡片里按 16px 圆形裁切显示，
    改动图形后务必在 16px 下再看一眼。
  -->
