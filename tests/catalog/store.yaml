  - id: STORE-028
    title: 设置中展示存储文件路径并支持拷贝与定位
    priority: P1
    class: A
    rules: [R-STORE-HOST-PATH, R-STORE-HOST-FILE]
    risk: ux
    expected:
      - 设置 › 数据存储分组显示完整路径，而不是藏在「关于」里、也不只有文件名
      - 拷贝按钮把完整路径写入剪贴板
      - 显示按钮请求宿主在文件管理器中定位该文件
