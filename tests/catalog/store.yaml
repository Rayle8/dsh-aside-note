    rules: [R-STORE-HOST-UNAVAILABLE, R-STORE-READ-FAIL]
    risk: data_loss
    expected:
      - 面板显示存储错误，不展示浏览器旧便笺
      - 新增失败，不写浏览器便笺键
    automation:
      - type: integration
