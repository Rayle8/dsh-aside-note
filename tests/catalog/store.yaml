        file: tests/host-store.test.mjs
        test: STORE-024 迁移中断后重启补完且不重复
        status: automated
    suites: [pr, nightly, release]
    tags: [host, migration, recovery]

  - id: STORE-025
    title: 宿主文件打不开时不切换并提示
    priority: P0
    class: D
    rules: [R-STORE-HOST-UNAVAILABLE, R-STORE-CORRUPT]
    risk: data_loss
    expected:
      - 不发生迁移，不写模式标记
      - 浏览器便笺继续可用，并给出存储不可用提示
    automation:
      - type: integration
        file: tests/host-bundle.test.mjs
        test: STORE-025 宿主文件打不开时不切换并提示
        status: automated
      - type: unit
        file: tests/host-store.test.mjs
        test: STORE-025 宿主文件打不开时报告存储错误
        status: automated
    suites: [pr, nightly, release]
    tags: [host, corruption, fallback]

  - id: STORE-026
    title: 宿主模式偏好与转发标记持久化
    priority: P1
    class: B
    rules: [R-STORE-HOST-FILE]
    risk: ux
    expected:
      - 范围选择、快捷键、转发前缀写入 global
      - 转发标记写入 forwarded，并可按清单读回
    automation:
      - type: unit
        file: tests/host-store.test.mjs
        test: STORE-026 宿主模式偏好持久化
        status: automated
      - type: unit
        file: tests/host-store.test.mjs
        test: STORE-026 宿主模式转发标记持久化
        status: automated
    suites: [nightly, release]
    tags: [host, prefs, forward]

  - id: STORE-027
    title: 宿主模式 400 条仍可新增
    priority: P2
    class: C
    rules: [R-STORE-CAPACITY]
    risk: ux
    expected:
      - 400 条全部保存
      - 再新增一条后为 401 条
    automation:
      - type: unit
        file: tests/host-store.test.mjs
        test: STORE-027 宿主模式 400 条仍可新增
        status: automated
    suites: [nightly, release]
