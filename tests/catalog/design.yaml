# 业务规则与不变量（用例的唯一设计来源）
#
# 这个文件不引用任何测试、函数或文件名。它只回答一个问题：
# 「什么样算对」。用例（cases/*.yaml）从这里的规则推导，
# 测试再从用例派生 —— 顺序不能反过来。
#
# 评审友好性约定（`npm run design:review` 会用到）：
#   - statement：规则本身，业务语言，避免代码标识符。
#   - failure：违反它时用户会遇到什么。评审先看这一行，判断“要不要这样”。
#   - branches：结构化分支，kind 取 valid / invalid / boundary / n-a；
#     n-a 表示这条规则不存在需要拒绝的分支，必须在 reason 里说明为什么。
#   - technique：推导用例时用的方法。
#   - reviewed：{ by, at, hash }，由 `design:review --approve` 写入；
#     hash 覆盖 statement+failure+branches，改了内容评审自动失效。
#
# technique 取值：等价类 / 边界值 / 决策表 / 状态迁移 / 故障注入 / 不变量 / 时序
version: 1

features:
  - id: note
    title: 便笺内容与生命周期
    owner: note
    rules:
      - id: R-NOTE-TEXT
        statement: 便笺文本去除首尾空白后必须非空；超过 280 字符的部分被截断，而不是拒绝写入。
        failure: 空白便笺变成点不掉的空行；超长粘贴被整条拒绝，用户以为没记上。
        kind: validation
        branches:
          - kind: valid
            text: 1–280 字符的非空文本被完整保存
          - kind: invalid
            text: 空或纯空白文本不产生任何记录
          - kind: boundary
            text: 280 字符完整保留，281 字符起被截断到 280
        technique: [等价类, 边界值]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '7735d0c52aa7591c' }

      - id: R-NOTE-ORDER
        statement: 未完成便笺按创建时间倒序排列；已完成便笺按完成时间倒序排列。
        failure: 新便笺沉到底部、刚完成的找不到，用户重复记录同一件事。
        kind: presentation
        branches:
          - kind: valid
            text: 新记的排最前，新完成的排在已完成最前
          - kind: n-a
            reason: 排序规则对任意合法数据都有定义，不存在需要拒绝的输入
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '974a043172743bb4' }

      - id: R-NOTE-AGE
        statement: 便笺的时间文案按经过时长分档：不足 1 分钟显示「刚刚」，不足 1 小时按分钟，不足 24 小时按小时，不足 7 天按天，再早显示日期。
        failure: 刚记的便笺显示成「8 天前」，或旧便笺永远显示「刚刚」，用户无法判断新鲜度。
        kind: presentation
        branches:
          - kind: valid
            text: 各分档显示对应文案
          - kind: boundary
            text: 59 秒仍是「刚刚」，60 秒起按分钟；23/24 小时、6/7 天同样在边界切换
        technique: [边界值, 时序]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '6f4eaf92904de1da' }

      - id: R-NOTE-LIFECYCLE
        statement: 便笺可在未完成与已完成之间来回切换；删除立即生效；无便笺时显示空状态。
        failure: 取消完成后仍带完成时间、角标不回升，用户以为状态没保存。
        kind: state
        branches:
          - kind: valid
            text: 完成 → 进入已完成区；取消完成 → 回到未完成区且不再带完成时间
          - kind: valid
            text: 编辑就地生效；删除后从清单消失
          - kind: n-a
            reason: 状态迁移只存在合法分支；非法状态请求在 UI 上不可达
        technique: [状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'fe4eac4d766c1753' }

      - id: R-NOTE-CONFIRM
        statement: 清除已完成属于破坏性操作，必须二次确认；确认窗口 5 秒内未操作则自动失效。
        failure: 一次误点清空全部已完成事项，且没有撤销入口。
        kind: rule
        branches:
          - kind: valid
            text: 5 秒内二次确认才删除
          - kind: invalid
            text: 只点一次不删除；超过 5 秒后再点需要重新确认
        technique: [状态迁移, 时序]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'b3a3626beb53e4e4' }

      - id: R-NOTE-PERSIST
        statement: 新增/修改/删除成功后立即持久化，刷新页面仍在；写入失败时界面不得假装成功。
        failure: 关掉面板或刷新后便笺消失；失败时界面仍显示“已保存”。
        kind: persistence
        branches:
          - kind: valid
            text: 成功后重开面板或刷新仍是同一份数据
          - kind: invalid
            text: 写入失败保留原样并明确提示
        technique: [故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'e5cfb069b9bd1701' }

  - id: scope
    title: 清单范围与归属
    owner: scope
    rules:
      - id: R-SCOPE-DEFAULT
        statement: 会话属于某个工作区时，默认展示并写入工作区清单；面板可在工作区清单与本会话清单之间切换，选择被记住。
        failure: 打开别的会话看到不属于它的便笺；或每次打开都要手动切一次范围。
        kind: scope
        branches:
          - kind: valid
            text: 切换后只看到对应清单的内容，角标跟随所选范围
          - kind: invalid
            text: 记住的选择遇到空白新会话时回落工作区清单，不显示空清单
        technique: [决策表, 状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'fed1678af40d8f69' }

      - id: R-SCOPE-BLANK
        statement: 空白新会话（还没有第一轮对话）只能写工作区清单；首轮对话后解锁会话清单。
        failure: 空白会话里写进一个还不存在的会话清单，首轮后内容凭空消失。
        kind: rule
        branches:
          - kind: valid
            text: 首轮后出现“会话”选项并可写入
          - kind: invalid
            text: 首轮前面板不提供会话选项
        technique: [状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '43232e64f5933fb3' }

      - id: R-SCOPE-NOWORKSPACE
        statement: 宿主未提供工作区、或会话未出现在任何工作区清单时，按会话清单处理，不得回落到任何工作区清单。
        failure: 无工作区的会话读到别人的便笺，或把内容写进共享清单。
        kind: scope
        branches:
          - kind: valid
            text: 只有会话清单
          - kind: n-a
            reason: 越界访问是缺陷而不是被允许的分支，没有“合法地回落到别人清单”的情况
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '6e1da1e861f31c12' }

      - id: R-SCOPE-SEED
        statement: 第一次见到某个工作区时，把成员会话里已有便笺并入共享清单，每个会话只并入一次；用户之后删除的条目不会因再次并入而复活。
        failure: 旧便笺没并进来（丢数据）；或每次打开都重复并入（重复条目）。
        kind: migration
        branches:
          - kind: valid
            text: 成员会话的便笺各出现一次
          - kind: invalid
            text: 重复打开工作区不产生重复条目
        technique: [等价类, 状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '4970a4b723260b94' }

      - id: R-SCOPE-SAVE
        statement: 提交时落到「提交那一刻选中的清单」，而不是历史选择或默认值。
        failure: 以为在会话清单里记，实际写进共享清单，被同事看到。
        kind: rule
        branches:
          - kind: valid
            text: 工作区范围提交进工作区清单，会话范围提交进会话清单
          - kind: invalid
            text: 切换范围不会把已输入内容写进另一个清单
        technique: [决策表]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '0509b1d051780454' }

  - id: store
    title: 存储、草稿与并发
    owner: store
    rules:
      - id: R-STORE-V1
        statement: 未切换时浏览器回退数据保持既有 v1 结构；切换后宿主数据使用 aside_note 领域（sessions/workspaces/forwarded + global）；升级不把旧键改写成另一套结构，也不改写宿主文件格式。
        failure: 升级后旧浏览器数据读不出来，或切换前后的结构互相覆盖，用户在两处看到不同便笺。
        kind: migration
        branches:
          - kind: valid
            text: 未切换时浏览器旧数据原样可读、可写
          - kind: valid
            text: 切换后宿主文件沿用 aside_note v1 领域结构
          - kind: n-a
            reason: 两条介质都不存在“合法地改写结构”的分支
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '9668dc583e674b32' }

      - id: R-STORE-HOST-FILE
        statement: 切换后便笺的唯一数据源是 DSH 宿主的本地文件；设备状态（面板宽高、分区、统计开关、草稿）仍留在浏览器。
        failure: 换浏览器或清站点数据后便笺丢失；或同一份便笺在文件和浏览器里各写一份，恢复后出现两份真相。
        kind: persistence
        branches:
          - kind: valid
            text: 宿主可用时便笺只读写宿主文件，设备状态仍按浏览器保存
          - kind: invalid
            text: 切换后仍把便笺写进浏览器键，或把设备状态写进宿主文件
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'bb716c7275e76ac7' }

      - id: R-STORE-HOST-PATH
        statement: 设置页必须展示宿主存储文件的完整路径；用户可以拷贝该路径，或在宿主的文件管理器中定位文件；无法定位时必须说明原因，不得猜测。
        failure: 想备份或排查却找不到文件，只能猜默认目录；或显示一个实际不存在的路径。
        kind: presentation
        branches:
          - kind: valid
            text: 后端有文件路径——展示完整路径，并可拷贝与在文件管理器中定位
          - kind: invalid
            text: 后端无路径或路径未知——说明不可定位，不展示猜测路径
        technique: [等价类, 故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '17100762309354c1' }

      - id: R-STORE-HOST-SWITCH
        statement: 升级后首次启动探测宿主存储：可用时把浏览器旧数据迁移一次并写一次性模式标记，之后单向使用宿主；不可用时不切换、保留浏览器数据、提示并在下次启动重试；迁移中断后重启应补完且不重复。
        failure: 每次启动重复迁移产生重复条目；或不可用时假装切换，用户新写的便笺留在浏览器而宿主恢复后看不到。
        kind: migration
        branches:
          - kind: valid
            text: 宿主可用且为空——迁移旧数据并写标记
          - kind: valid
            text: 宿主可用且已有数据——不迁移，保留浏览器副本并提示
          - kind: boundary
            text: 迁移中断后重启——补完未完成迁移，且不重复写入
          - kind: invalid
            text: 宿主不可用却写标记、清空浏览器数据或假装已切换
        technique: [状态迁移, 故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '5e03c3a7efb29cfa' }

      - id: R-STORE-HOST-UNAVAILABLE
        statement: 已切换后宿主不可用（路由缺失、文件打不开、网络失败）时，面板进入错误态并停止写入，不得改回浏览器存储；未切换时宿主不可用则继续使用浏览器存储并提示。
        failure: 宿主故障时偷偷写浏览器，恢复后两份数据分叉；或已切换后仍展示浏览器旧数据，用户误以为宿主便笺丢了。
        kind: failure
        branches:
          - kind: valid
            text: 未切换 + 宿主不可用——继续用浏览器存储，提示原因，不写标记
          - kind: invalid
            text: 已切换 + 宿主不可用——写入浏览器或静默回退展示浏览器数据
        technique: [故障注入, 状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '45c3ff6a106d764b' }

      - id: R-STORE-HOST-MERGE
        statement: 宿主模式写入只提交本页新增、修改与删除的条目，由宿主在最新记录上按 key 串行原子合并；另一标签页新增的条目不得被整条记录覆盖。
        failure: 两个标签页同时编辑，后写的一侧把另一侧刚记的条目整条覆盖，用户丢便笺。
        kind: consistency
        branches:
          - kind: valid
            text: 两端新增都保留；同一条目冲突取较新的修改
          - kind: invalid
            text: 用整条记录覆盖宿主最新记录，丢掉另一侧新增
        technique: [并发测试, 不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '0c75e92b9ea9a6b8' }

      - id: R-STORE-CORRUPT
        statement: 浏览器回退数据无法解析时，原始内容必须先原样备份，再按空清单继续；宿主文件无法打开时不得静默重建、不得改回浏览器写入，必须报错并停止写入。
        failure: 一次坏数据导致便笺被静默清空；或宿主文件损坏时自动重建/切回浏览器，把用户带到错误的空状态。
        kind: persistence
        branches:
          - kind: valid
            text: 浏览器坏数据备份到 `<键>.corrupt` 后继续，面板仍可用
          - kind: invalid
            text: 宿主文件打不开却自动重建，或静默改用浏览器数据
        technique: [故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '81fe1dffc224b73e' }

      - id: R-STORE-SANITIZE
        statement: 存储里的单条记录字段不合法时按缺失处理：非对象、空文本或重复 id 的条目被丢弃或修正，不渲染乱码，也不让面板崩溃。
        failure: 手改或旧版本留下的脏条目让列表显示 undefined，或一次坏条目把整份清单带崩。
        kind: failure
        branches:
          - kind: valid
            text: 合法条目原样保留
          - kind: invalid
            text: 非对象被丢弃、空文本被丢弃、重复 id 被重新分配、非法时间戳被修正
        technique: [等价类, 故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '18091170c2cdd40b' }

      - id: R-STORE-MERGE
        statement: 写入前必须基于最新记录合并：浏览器回退路径读回最新记录按 id 合并；宿主路径只提交变更条目，由宿主原子合并。不得整份覆盖另一标签页的写入；同一条目冲突取较新的修改；本页删除的条目不得被并发写入复活。
        failure: 两个标签页各记一条，最后只剩一条（另一条被整份覆盖）。
        kind: consistency
        branches:
          - kind: valid
            text: 两端新增都保留；冲突取新；本页删除保持删除
          - kind: n-a
            reason: 整份覆盖属于缺陷，没有合法的覆盖分支
        technique: [并发测试, 不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '5c3eb072465fc0de' }

      - id: R-STORE-SYNC
        statement: 其他标签页写入后，本页已打开的入口与面板必须自行刷新：浏览器回退用 storage 事件，宿主模式用 BroadcastChannel；不需要用户手动重开。
        failure: 另一标签页删了，本页还显示；再操作就把已删条目写回去。
        kind: consistency
        branches:
          - kind: valid
            text: 另一标签页新增/删除后，本页角标与列表跟随
          - kind: n-a
            reason: 不刷新是缺陷，不存在“合法地停留旧数据”的分支
        technique: [并发测试]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '7a11e51e90661dbf' }

      - id: R-STORE-SYNC-ORDER
        statement: 宿主模式同步必须以宿主最新快照为准，旧写入回包或过期快照不得覆盖另一标签页已完成的更新。
        failure: 两个标签页的保存响应反序到达时，已保存的较新便笺从一个或两个面板消失。
        kind: consistency
        branches:
          - kind: valid
            text: 同一清单反序回包后，两页显示宿主的同一最新清单
          - kind: boundary
            text: 读取快照期间发生本地写入或收到新通知时，重新从宿主读取再刷新
        technique: [并发测试, 时序]

      - id: R-STORE-READ-FAIL
        statement: 存储读不到时：未切换的浏览器回退按空清单继续，面板仍能打开；已切换的宿主模式进入错误态并停止写入，不得改为读取浏览器旧数据。
        failure: 一次存储不可读就让面板打不开，用户连新便笺都记不了；或已切换后把浏览器旧数据当成宿主便笺展示。
        kind: failure
        branches:
          - kind: valid
            text: 未切换 + 读不到——按空清单继续，面板可用
          - kind: invalid
            text: 已切换 + 读不到——回退展示浏览器旧数据或继续写入
        technique: [故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'fb7ce37f1761a03e' }

      - id: R-STORE-WRITE-FAIL
        statement: 写入失败时（浏览器配额/磁盘/权限，宿主路由拒绝、超时或文件不可写），读取照常显示已保存内容，界面保留输入并明确提示，不产生幽灵条目；宿主模式不得把失败写入改存到浏览器。
        failure: 用户以为记下了实际没落盘；或写失败后连原本已保存的便笺也看不见了。
        kind: failure
        branches:
          - kind: valid
            text: 可写时正常保存
          - kind: invalid
            text: 写不进时（配额、磁盘、只读、宿主失败）读取不受影响，输入保留、提示明确、不出现幽灵条目
        technique: [故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '7e70f66d1628b56b' }

      - id: R-STORE-CAPACITY
        statement: 清单条数不设上限；条目很多时仍能展示、新增和删除，不因条数被拒绝。
        failure: 条目多的用户在新增时被静默丢弃，或面板因为条数太多而卡死。
        kind: boundary
        branches:
          - kind: valid
            text: 常规条目数下读写正常
          - kind: boundary
            text: 数百条时仍可展示、新增与删除
        technique: [边界值]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '24df7dc485c8b41f' }

  - id: draft
    title: 未提交草稿
    owner: draft
    rules:
      - id: R-DRAFT-SCOPE
        statement: 草稿属于工作区而不是单个会话；切换会话或在两种范围间切换，半截文字都不丢。
        failure: 切个会话半截文字就没了，用户得重打一遍。
        kind: persistence
        branches:
          - kind: valid
            text: 同一工作区的任一会话都能看到同一份草稿
          - kind: invalid
            text: 提交后草稿被消费，不残留
        technique: [状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'fe6c716dde20955b' }

      - id: R-DRAFT-MIGRATE
        statement: 升级前按会话保存的草稿，首次打开工作区时并入共享键，旧副本退役，不重复并入。
        failure: 升级后旧草稿再也不出现；或同一份旧草稿被重复并入。
        kind: migration
        branches:
          - kind: valid
            text: 旧草稿并入并可继续编辑
          - kind: invalid
            text: 旧副本不再出现
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '38f2ff4195c054e4' }

  - id: forward
    title: 转发回输入框
    owner: forward
    rules:
      - id: R-FWD-TARGET
        statement: 转发只写入当前可见会话的输入框，不得写进其他会话。
        failure: 便笺被转发进另一个会话的输入框，用户发错内容。
        kind: scope
        branches:
          - kind: valid
            text: 目标会话出现该条目，其他会话输入框不变
          - kind: n-a
            reason: 写错会话是缺陷，没有合法的“转发到别处”分支
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'f889b86a9acb21f4' }

      - id: R-FWD-PREFIX
        statement: 前缀有三种状态：未自定义（按当前语言解析默认值）、已自定义（原文使用）、显式清空（不加任何前缀）；解析发生在点击转发的那一刻。
        failure: 中文界面用英文前缀；清空了前缀却仍然带默认前缀。
        kind: rule
        branches:
          - kind: valid
            text: 三种状态各自产生正确结果
          - kind: boundary
            text: 跨越语言切换后仍按点击时的语言解析
        technique: [决策表, 状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'e8124c362df950c2' }

      - id: R-FWD-MARK
        statement: 转发过的条目在所属清单上打标记，且标记不随范围切换丢失或串到别的清单。
        failure: 转发过的条目换会话后又变成可转发，同一内容被发两次。
        kind: state
        branches:
          - kind: valid
            text: 标记记在对应清单
          - kind: n-a
            reason: 标记属于状态而非输入校验，没有需要拒绝的分支
        technique: [状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'b9dad43a2bd6085b' }

  - id: panel
    title: 入口与面板
    owner: panel
    rules:
      - id: R-PANEL-ENTRY
        statement: 入口出现在会话工具行；空白新会话没有工具行时出现在右上角。入口显示未完成数量，点击打开面板。
        failure: 找不到入口；角标数字和列表对不上。
        kind: presentation
        branches:
          - kind: valid
            text: 两种会话状态下入口位置与计数都正确
          - kind: n-a
            reason: 入口缺失等于功能不可用，没有合法的“不显示入口”分支
        technique: [决策表]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'f15ee9c2df6d8f6f' }

      - id: R-PANEL-GEOMETRY
        statement: 面板宽度限制在 280–720 之间，且不超过视口可用宽度；调整后的宽度被记住。
        failure: 面板宽到超出屏幕，或窄到内容不可读。
        kind: boundary
        branches:
          - kind: valid
            text: 调整并持久化
          - kind: boundary
            text: 越过上下限时夹住，不出现溢出
        technique: [边界值]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '25d0468e3383a6ee' }

      - id: R-PANEL-SETTINGS
        statement: 面板设置（宽度、发送快捷键、转发前缀）修改后立即生效并持久化，重开面板保持。
        failure: 每次打开面板都要重设宽度和快捷键。
        kind: persistence
        branches:
          - kind: valid
            text: 修改后持久化
          - kind: n-a
            reason: 设置项没有非法取值，不需要拒绝分支
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '41ef4616618ed6c8' }

      - id: R-PANEL-ANALYTICS
        statement: 匿名统计默认开启且必须说明上报内容；关闭后立即生效，开关本身是最后一次上报，之后不再产生任何事件。
        failure: 用户关闭统计后仍在后台上报，隐私承诺失效。
        kind: privacy
        branches:
          - kind: valid
            text: 关闭后零上报
          - kind: invalid
            text: 关闭后仍上报属于缺陷
        technique: [状态迁移]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'f956d794b43be4b2' }

      - id: R-PANEL-SECTIONS
        statement: 未完成/已完成分区的折叠状态被记住，重开面板保持。
        failure: 每次打开都要重新折叠已完成区。
        kind: persistence
        branches:
          - kind: valid
            text: 折叠后重开仍是折叠
          - kind: n-a
            reason: 折叠只有两个合法状态，没有需要拒绝的取值
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '9f1778da900f1d2c' }

  - id: copy
    title: 面板文案与隐私披露
    owner: panel
    rules:
      - id: R-PANEL-COPY
        statement: 面板的标题、输入占位、页脚隐私说明与关于区身份都来自当前语言词典；页脚说明便笺仅保存在本地，关于区展示产品名与标语。
        failure: 用户看不到「数据只在本地」的说明，或界面冒出另一种语言的文案。
        kind: presentation
        branches:
          - kind: valid
            text: 四类文案都来自词典且内容正确
          - kind: n-a
            reason: 文案缺失由 i18n 回落处理，这里没有需要拒绝的输入
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'a43096db50760d5a' }

  - id: i18n
    title: 语言与文案
    owner: i18n
    rules:
      - id: R-I18N-PREFIX
        statement: 未自定义的转发前缀跟随当前界面语言，切换语言后已打开的面板立即跟随。
        failure: 切到英文后面板仍用中文前缀，转发出去的语言混杂。
        kind: presentation
        branches:
          - kind: valid
            text: 中文界面用中文默认前缀，英文界面用英文
          - kind: n-a
            reason: 语言解析没有非法输入，只有“缺 key”这种由下一条规则处理的情况
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '5ae9720f66ed6a69' }

      - id: R-I18N-FALLBACK
        statement: 未知语言或缺键时回落到英文，绝不回落到中文，也绝不把 key 直接显示给用户。
        failure: 未知语言时界面显示 popover.title 这样的 key，或突然变成中文。
        kind: failure
        branches:
          - kind: valid
            text: 未知语言显示英文
          - kind: invalid
            text: 显示 key 或中文属于缺陷
        technique: [等价类]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'cedb0ec5e5041016' }

  - id: update
    title: 更新中心
    owner: update
    rules:
      - id: R-UPD-SOURCE
        statement: 版本探测按 npm → 镜像 → GitHub Release 顺序回退，结果缓存 1 小时；手动检查绕过缓存。
        failure: npm 挂了就永远显示“已是最新”，用户装不上新版本。
        kind: failure
        branches:
          - kind: valid
            text: 首个源失败时回退到下一个
          - kind: boundary
            text: 1 小时内复用缓存，过期后重新探测
        technique: [故障注入, 时序]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'a31344b98b5104b6' }

      - id: R-UPD-NOTES
        statement: 更新说明只列「本地版本之后、最新版本之前」的发布，草稿与预发布一律不展示；最新版本默认展开，完整说明链接指向对应 Release 并在新标签页打开。
        failure: 说明里混进草稿和预发布版，用户被未发布内容误导。
        kind: rule
        branches:
          - kind: valid
            text: 区间内版本按倒序列出
          - kind: invalid
            text: 草稿、预发布、早于本版本的发布不出现
        technique: [边界值, 决策表]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: 'a07929925fc534fc' }

      - id: R-UPD-APPLY
        statement: 「立即更新」只走宿主更新端点，不得回落到插件市场；成功后引导刷新，需要重启时说清楚。
        failure: 点更新跳去插件市场，装到别的版本或根本装不上。
        kind: rule
        branches:
          - kind: valid
            text: 一次宿主请求完成安装
          - kind: n-a
            reason: 走市场是缺陷，没有合法的“换一条安装路径”分支
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '160b51afedf145d1' }

      - id: R-UPD-FAILURE
        statement: 宿主没有更新路由或拒绝更新时，必须给出手动命令兜底，不得显示成已更新。
        failure: 宿主不支持更新时仍显示“正在更新”，界面卡住且没有兜底。
        kind: failure
        branches:
          - kind: valid
            text: 给出可复制的命令
          - kind: invalid
            text: 显示成功属于缺陷
        technique: [故障注入]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '3bc5aa64954f74b1' }

  - id: package
    title: 产物与卸载
    owner: package
    rules:
      - id: R-PKG-BOOT
        statement: 产物能在 DSH 中加载并注册会话捕获、空白会话座位与全局 Toast 三个座位，携带 DSH 的八种官方语言。
        failure: 插件加载失败，面板不出现或页面出现加载错误。
        kind: interaction
        branches:
          - kind: valid
            text: 加载后三个座位与八种语言都在
          - kind: n-a
            reason: 加载失败等于不可用，没有合法的“少注册一个座位”分支
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '6b309dbc43e97878' }

      - id: R-PKG-DISPOSE
        statement: 卸载后注入的样式被移除，页面不残留插件痕迹。
        failure: 卸载后残留样式，其他插件的布局被影响。
        kind: interaction
        branches:
          - kind: valid
            text: 卸载后样式归零
          - kind: n-a
            reason: 残留是缺陷，没有合法的“部分清理”分支
        technique: [不变量]
        reviewed: { by: "reviewed-in-chat", at: '2026-11-18', hash: '71bb5980b72bacbd' }

invariants:
  - id: INV-NO-LOSS
    statement: 用户已经写下的便笺，不会因为数据损坏、并发写入或存储失败而静默消失。
    rules: [R-STORE-CORRUPT, R-STORE-MERGE, R-STORE-READ-FAIL, R-STORE-WRITE-FAIL, R-NOTE-PERSIST]

  - id: INV-NO-CROSS-SCOPE
    statement: 一条便笺只在其所属清单可见可写；工作区、会话、转发目标之间不串数据。
    rules: [R-SCOPE-DEFAULT, R-SCOPE-SAVE, R-FWD-TARGET, R-STORE-SYNC]

  - id: INV-IDEMPOTENT
    statement: 同一条目最多存在一份有效记录；重复并入、重复写入不产生重复。
    rules: [R-SCOPE-SEED, R-STORE-MERGE]

  - id: INV-NO-SILENT-SUCCESS
    statement: 失败必须可见：写失败、更新失败、加载失败都要明确告知，不得报告成功。
    rules: [R-STORE-WRITE-FAIL, R-UPD-FAILURE, R-PKG-BOOT]
