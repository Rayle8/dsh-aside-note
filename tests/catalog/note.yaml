# 便笺内容与生命周期（NOTE）
#
# 业务语义：用户写了什么、留下什么。这里的 expected 是验收标准，
# 只能由人修改；重构、改名只允许调整 automation 指针。
domain: note
owner: note

cases:
  - id: NOTE-001
    title: 经表单新增便笺写入存储并刷新角标
    priority: P0
    class: A
    rules: [R-NOTE-PERSIST, R-NOTE-TEXT, R-STORE-WRITE-FAIL]
    risk: data_loss
    expected:
      - 输入为空时「添加」按钮不可用
      - 提交后该条出现在列表，并写入当前清单对应的存储键
      - 入口角标在下一帧内加一
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: NOTE-001 经表单新增便笺写入存储并刷新角标
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [persistence, badge]

  - id: NOTE-002
    title: 完成便笺与清除已完成需二次确认
    priority: P0
    class: C
    rules: [R-NOTE-CONFIRM, R-NOTE-LIFECYCLE]
    risk: data_loss
    expected:
      - 勾选后该条进入已完成分区，角标减一
      - 清除已完成先出现确认，第二次点击才删除
      - 删除只影响已完成条目，未完成条目保留
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: NOTE-002 完成便笺与清除已完成需二次确认
        status: automated
    suites: [pr, nightly, release]
    tags: [destructive, confirm]

  - id: NOTE-003
    title: 就地编辑便笺并持久化
    priority: P1
    class: B
    rules: [R-NOTE-LIFECYCLE]
    risk: data_loss
    expected:
      - 编辑按钮把该行换成行内编辑器
      - 确认后文本写入存储，列表同步更新
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: NOTE-003 就地编辑便笺并持久化
        status: automated
    suites: [pr, nightly, release]
    tags: [edit, persistence]

  - id: NOTE-004
    title: 删除最后一条后回到空状态
    priority: P1
    class: B
    rules: [R-NOTE-LIFECYCLE]
    risk: ux
    expected:
      - 删除后存储中该清单为空
      - 面板回落到空状态并显示引导文案
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: NOTE-004 删除最后一条后回到空状态
        status: automated
    suites: [pr, nightly, release]
    tags: [delete, empty-state]

  - id: NOTE-005
    title: 纯空白文本不产生记录
    priority: P1
    class: D
    rules: [R-NOTE-TEXT]
    risk: ux
    expected:
      - 只含空格、制表符或换行的输入不能提交，且不产生空条目
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: NOTE-005 纯空白文本不产生记录
        status: automated
    suites: [pr, nightly, release]
    tags: [validation, whitespace]

  - id: NOTE-006
    title: 超长文本截断到 280 字符
    priority: P1
    class: C
    rules: [R-NOTE-TEXT]
    risk: data_loss
    expected:
      - 280 字符原样保存
      - 281 字符只保留前 280 个字符，不报错也不丢整条
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: NOTE-006 超长文本截断到 280 字符
        status: automated
    suites: [pr, nightly, release]
    tags: [validation, boundary]

  - id: NOTE-007
    title: 已完成条目按完成时间倒序
    priority: P2
    class: C
    rules: [R-NOTE-ORDER]
    risk: ux
    expected:
      - 后完成的条目排在已完成分区最前
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: NOTE-007 已完成条目按完成时间倒序
        status: automated
    suites: [nightly, release]
    tags: [ordering]

  - id: NOTE-008
    title: 取消完成后回到未完成区
    priority: P1
    class: C
    rules: [R-NOTE-LIFECYCLE]
    risk: ux
    expected:
      - 取消完成后条目回到未完成区
      - 该条目不再携带完成时间，角标相应加一
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: NOTE-008 取消完成后回到未完成区
        status: automated
    suites: [pr, nightly, release]
    tags: [state-transition]

  - id: NOTE-009
    title: 相对时间按经过时长分档
    priority: P2
    class: C
    rules: [R-NOTE-AGE]
    risk: ux
    expected:
      - 30 秒前显示「刚刚」，2 分钟前、3 小时前、2 天前分别按分钟、小时、天显示
      - 超过 7 天显示日期
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: NOTE-009 相对时间按经过时长分档
        status: automated
    suites: [nightly, release]
    tags: [time, copy]

  - id: NOTE-010
    title: 保存回包保留下一份草稿且不重复提交
    priority: P1
    class: F
    rules: [R-NOTE-PENDING-DRAFT]
    risk: data_loss
    expected:
      - 保存等待期间重复点击或按键只产生一次写入
      - 用户在等待期间输入下一份草稿，前一次保存完成后新草稿仍在界面和浏览器存储
      - 可单独提交新草稿，成功后清空当次草稿
    automation:
      - type: integration
        file: tests/async-note-save.test.mjs
        test: NOTE-010 保存回包保留下一份草稿且不重复提交
        status: automated
    suites: [pr, nightly, release]
    tags: [host, draft, concurrency]
